
name: Build DIPTO AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: unzip -o dipto_ai_call_assistant_cloudbuild.zip

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: dipto_ai_call_assistant/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIPTO-AI-APK
          path: dipto_ai_call_assistant/android/app/build/outputs/apk/debug/app-debug.apk
